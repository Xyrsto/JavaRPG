name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token and no secrets anywhere: pull requests from forks run with the same limits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run all non-Docker tests
        run: mvn -B --no-transfer-progress verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 3
          if-no-files-found: warn

  docker-tests:
    name: docker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the sandbox image from the repository
        run: docker build -t javarpg-runner:1 runner/docker
      - name: Run all tests including the Docker-backed sandbox tests
        run: mvn -B --no-transfer-progress verify -Ddocker.tests=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-tests-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 3
          if-no-files-found: warn
