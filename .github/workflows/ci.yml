name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token and no secrets anywhere: pull requests from forks run with the same limits.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run all non-Docker tests
        run: mvn -B --no-transfer-progress verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 3
          if-no-files-found: warn

  docker-tests:
    name: docker-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the sandbox image from the repository
        run: docker build -t javarpg-runner:1 runner/docker
      - name: Run all tests including the Docker-backed sandbox tests
        run: mvn -B --no-transfer-progress verify -Ddocker.tests=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-tests-test-reports
          path: '**/target/surefire-reports/'
          retention-days: 3
          if-no-files-found: warn

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the exact locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: The generated API types are up to date with the API description
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts
      - name: Production build
        run: npm run build
      - name: No references to other sites, size budget
        run: node scripts/check-dist.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: The server packs the client when asked to
        working-directory: .
        run: |
          mvn -B --no-transfer-progress -Pweb -pl server -am package -DskipTests
          unzip -l server/target/server-*-SNAPSHOT.jar | grep -q "BOOT-INF/classes/static/index.html"
