server.port=8080
# Loopback only by default for ALL modes. To serve other machines (deployment, docker mode only) override with
# SERVER_ADDRESS=0.0.0.0 or --server.address=0.0.0.0 and put an authenticating reverse proxy in front.
server.address=127.0.0.1
server.tomcat.threads.max=50
javarpg.content.dir=content/quests
javarpg.world.file=content/world/village.json
javarpg.data.dir=./data
javarpg.sandbox.mode=docker
javarpg.sandbox.max-concurrent=2
javarpg.sandbox.image=javarpg-runner:1
javarpg.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
spring.datasource.url=jdbc:h2:file:${javarpg.data.dir}/javarpg
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
javarpg.sandbox.allow-unsafe=false
javarpg.sandbox.acquire-wait-millis=0
javarpg.http.max-body-bytes=65536
javarpg.rate.players-per-minute=5
javarpg.rate.run-per-minute=10
javarpg.rate.submit-per-minute=10
javarpg.rate.trust-forwarded=false
javarpg.rate.max-tracked-clients=10000
javarpg.players.max=10000
javarpg.players.idle-days=30
# API description (OpenAPI) and the browser page. Switched by javarpg.docs.enabled, see DocsSwitch.
springdoc.paths-to-match=/api/**,/health
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
