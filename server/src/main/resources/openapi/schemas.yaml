# Wording for every response and request shape of the API description (spec 004).
# Per schema: description; properties (description plus optional enum, maxLength, maxItems, minimum);
# optional = properties that may be null or absent (all others are always present).
# withheld: true         -> never filled before the quest is completed (x-withheld-until-completed)
# hiddenBlank: true      -> never filled for hidden tests (x-never-shown-for-hidden-tests)
Point:
  description: A tile position on the world map. x counts columns from the left, y counts rows from the top, both starting at 0.
  properties:
    x: {description: "Column, counted from the left starting at 0."}
    y: {description: "Row, counted from the top starting at 0."}
WorldEffect:
  description: A change to the world that a completed quest causes, shown to the player as a message.
  properties:
    type: {description: "What happens. Currently always OPEN_GATE.", enum: [OPEN_GATE]}
    target: {description: "The id of the gate that is affected, as in WorldView.gates."}
    message: {description: "Text to show the player."}
GateView:
  description: A gate on the map. Gates are walls until the quest that opens them is completed.
  properties:
    id: {description: "Gate id, one capital letter that also appears in the map rows."}
    x: {description: "Column of the gate tile."}
    y: {description: "Row of the gate tile."}
NpcView:
  description: A character the player can talk to.
  properties:
    id: {description: "Stable character id."}
    name: {description: "Name to show."}
    x: {description: "Column of the character."}
    y: {description: "Row of the character."}
    questId: {description: "The quest this character gives."}
WorldView:
  description: The static map of the world. It is the same for every player; use the player view for where this player stands and which gates are open.
  properties:
    id: {description: "World id."}
    width: {description: "Number of columns."}
    height: {description: "Number of rows."}
    rows: {description: "The map, one string per row. Each character is a tile and is explained in legend."}
    legend: {description: "Meaning of each map character, for example # for wall and . for floor."}
    heroStart: {description: "Where new players start."}
    gates: {description: "All gates on the map."}
    npcs: {description: "All characters on the map."}
PlayerView:
  description: Everything the client needs to know about one player. The player id is the only credential, so keep it private.
  properties:
    playerId: {description: "The player id, a UUID. Use it in the address of every player operation."}
    xp: {description: "Experience points earned so far."}
    level: {description: "Current level, derived from xp."}
    levelFloorXp: {description: "Experience points at which the current level began."}
    nextLevelXp: {description: "Experience points needed for the next level."}
    completedQuestIds: {description: "Ids of the quests this player has completed, in completion order."}
    hero: {description: "Where the hero stands."}
    openGates: {description: "Ids of the gates that are open for this player."}
    worldEffects: {description: "The effects of the completed quests, in order, so the client can redraw the world."}
MoveRequest:
  description: A walk made of single steps.
  properties:
    directions:
      description: The steps to take, in order. Each one is UP, DOWN, LEFT or RIGHT.
      maxItems: 32
      minItems: 1
MoveResponse:
  description: Where the hero ended up after the steps.
  properties:
    x: {description: "Column after the move."}
    y: {description: "Row after the move."}
    applied: {description: "How many of the steps were taken before the walk ended."}
    blocked: {description: "True when the walk stopped early because of a wall, a closed gate or a character."}
InteractResponse:
  description: What the character next to the hero says, and the state of the quest they give.
  properties:
    npcId: {description: "Id of the character."}
    npcName: {description: "Name of the character."}
    questId: {description: "The quest this character gives."}
    questStatus: {description: "State of that quest for this player.", enum: [LOCKED, AVAILABLE, COMPLETED]}
    lines: {description: "What the character says. After the quest is completed these are the thank-you lines."}
QuestSummary:
  description: One line of the quest list.
  properties:
    id: {description: "Quest id such as V01. The letter is the region and the number is the order."}
    region: {description: "Region letter."}
    regionName: {description: "Region name."}
    title: {description: "Quest title."}
    concept: {description: "The one Java concept the quest teaches."}
    status: {description: "State for this player.", enum: [LOCKED, AVAILABLE, COMPLETED]}
    xp: {description: "Experience points the first completion awards."}
QuestListResponse:
  description: All quests in teaching order, with the state of each for this player.
  properties:
    quests: {description: "The quests in teaching order."}
VisibleTestView:
  description: A test the player may see before submitting. Hidden tests are never listed.
  properties:
    name: {description: "What the test checks, in words."}
    call: {description: "The call that is evaluated, for quests that grade returned values. Empty for quests that grade printed output."}
    expected: {description: "The expected result. Empty for tests that check the shape of the code instead of its result."}
  optional: [call, expected]
QuestDetailView:
  description: A quest as one player sees it. Fields marked as withheld stay empty until the player has completed the quest.
  properties:
    id: {description: "Quest id."}
    title: {description: "Quest title."}
    concept: {description: "The one Java concept the quest teaches."}
    story: {description: "The story hook, shown before the goal."}
    goal: {description: "What the player has to write."}
    kind: {description: "How the answer is graded. STDOUT grades what the program prints; METHOD_RETURN grades the values that the player's methods return.", enum: [STDOUT, METHOD_RETURN]}
    profile: {description: "What the sandbox allows for this quest. Only BASIC is available today.", enum: [BASIC, TESTING, FILES, THREADS, BUILD, SERVICE]}
    status: {description: "State for this player.", enum: [LOCKED, AVAILABLE, COMPLETED]}
    xp: {description: "Experience points the first completion awards."}
    starterCode: {description: "Code to start from, as one string with line breaks."}
    lastSource: {description: "The last code this player submitted or ran for this quest, so the editor can resume. Empty if none."}
    visibleTests: {description: "The tests the player can see."}
    hintsTotal: {description: "How many hints the quest has."}
    hintsUnlocked: {description: "How many of them this player has unlocked."}
    hints: {description: "The unlocked hints, in order, easiest first."}
    failedAttempts: {description: "Failed submits so far. Hints become available after the first failure."}
    explanation: {description: "Plain-language explanation of the concept. Withheld until the quest is completed.", withheld: true}
    referenceSolution: {description: "A model solution. Withheld until the quest is completed.", withheld: true}
    worldEffect: {description: "What completing the quest does to the world. Withheld until the quest is completed.", withheld: true}
  optional: [lastSource, explanation, referenceSolution, worldEffect]
SourceRequest:
  description: The Java source the player wrote.
  properties:
    source:
      description: The complete source as one string, with line breaks. The class that runs is Main for quests that grade printed output and Solution for quests that grade returned values.
      maxLength: 20000
TestResultView:
  description: The outcome of one test. For hidden tests only the name and whether it passed are shown.
  properties:
    name: {description: "What the test checks. Hidden tests are numbered instead of named."}
    hidden: {description: "True for tests the player cannot see before they submit."}
    passed: {description: "Whether the test passed."}
    expected: {description: "The expected result of a visible test. Never filled for hidden tests.", hiddenBlank: true}
    actual: {description: "What the program produced for a visible test. Never filled for hidden tests.", hiddenBlank: true}
    message: {description: "A short plain-language note about the outcome."}
  optional: [expected, actual]
RunResponse:
  description: The result of a trial run. Only the visible tests are evaluated, nothing is saved as progress, and no hidden data is returned.
  properties:
    questId: {description: "The quest that was run."}
    scope: {description: "Which tests were evaluated. Always VISIBLE for a run.", enum: [VISIBLE, ALL]}
    passed: {description: "True when every evaluated test passed."}
    status: {description: "How the sandbox run ended.", enum: [OK, COMPILE_ERROR, TIMEOUT, OUTPUT_LIMIT, MEMORY_LIMIT, RUNTIME_ERROR, SANDBOX_ERROR]}
    compilerOutput: {description: "The Java compiler output, empty when the code compiled."}
    stdout: {description: "What the program printed, shortened to a safe length."}
    stderr: {description: "What the program printed as errors, shortened to a safe length."}
    summary: {description: "One friendly sentence about the result."}
    friendlyHints: {description: "Plain-language advice for common mistakes, shown beside the real compiler or runtime output."}
    tests: {description: "One entry per evaluated test."}
    durationMillis: {description: "How long the sandbox run took, in milliseconds."}
CompletionView:
  description: What the first successful submit of a quest earns. Present only when the submit passed.
  properties:
    firstCompletion: {description: "True the first time this player completes the quest. XP is only awarded then."}
    xpAwarded: {description: "Experience points awarded by this submit, zero on a repeat."}
    totalXp: {description: "Total experience points after this submit."}
    level: {description: "Level after this submit."}
    levelUp: {description: "True when this submit raised the level."}
    worldEffect: {description: "What happens to the world."}
    explanation: {description: "Plain-language explanation of the concept."}
    unlockedQuestId: {description: "The quest that this completion unlocked, if any."}
  optional: [worldEffect, unlockedQuestId]
SubmitResponse:
  description: The result of a graded submit. All tests, including hidden ones, are evaluated. A pass records progress and awards experience points.
  properties:
    questId: {description: "The quest that was submitted."}
    scope: {description: "Which tests were evaluated. Always ALL for a submit.", enum: [VISIBLE, ALL]}
    passed: {description: "True when every test passed."}
    status: {description: "How the sandbox run ended.", enum: [OK, COMPILE_ERROR, TIMEOUT, OUTPUT_LIMIT, MEMORY_LIMIT, RUNTIME_ERROR, SANDBOX_ERROR]}
    compilerOutput: {description: "The Java compiler output, empty when the code compiled."}
    stdout: {description: "What the program printed, shortened to a safe length."}
    stderr: {description: "What the program printed as errors, shortened to a safe length."}
    summary: {description: "One friendly sentence about the result."}
    friendlyHints: {description: "Plain-language advice for common mistakes."}
    tests: {description: "One entry per test, hidden ones included but blanked."}
    durationMillis: {description: "How long the sandbox run took, in milliseconds."}
    completion: {description: "Present only when the submit passed. Empty otherwise."}
  optional: [completion]
HintResponse:
  description: The next hint for a quest.
  properties:
    hintNumber: {description: "Which hint this is, starting at 1."}
    hint: {description: "The hint text. Hints go from a nudge to nearly the answer."}
    hintsUnlocked: {description: "How many hints are unlocked now."}
    hintsTotal: {description: "How many hints the quest has."}
HealthView:
  description: Whether the server is up and how it runs player code.
  properties:
    status: {description: "UP when the server answers.", enum: [UP]}
    sandbox: {description: "How player code is run. docker is the safe mode."}
    sandboxSafe: {description: "True when player code runs in the isolated container."}
    questsLoaded: {description: "How many quests were loaded from the content files."}
    warning: {description: "A warning shown only when the sandbox mode is not the safe one."}
  optional: [warning]
ErrorBody:
  description: What went wrong. Show message to the player; use code in programs.
  properties:
    code: {description: "A stable code in capital letters. The full list, with the HTTP status and cause of each, is in x-error-codes of this schema."}
    message: {description: "A friendly sentence. It never contains internal details."}
ErrorEnvelope:
  description: Every failure of every operation has this shape.
  properties:
    error: {description: "The failure."}
