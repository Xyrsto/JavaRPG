# Wording and worked examples for every operation, keyed by operationId (<Controller>_<method>).
# OperationCoverageTest fails when an operation has no entry here or an entry has no operation, and
# ResponseConformanceTest checks that every example conforms to its schema. Examples use only the sample
# quest V01 and a made-up player id; they never contain real player data.
Health_health:
  tag: health
  summary: Check that the server is up
  description: Returns UP together with how player code is run and how many quests were loaded. Use it as a start-up check and to see whether the server runs the safe Docker sandbox. It needs no player id and is not rate limited.
  responses:
    "200":
      description: The server is up.
      example: {"status": "UP", "sandbox": "docker", "sandboxSafe": true, "questsLoaded": 2}
World_world:
  tag: world
  summary: Get the world map
  description: Returns the static village map with its gates and characters. It is the same for every player, so a client can load it once. Where a particular player stands and which gates are open is in the player view.
  responses:
    "200":
      description: The map.
      example: {"id": "village", "width": 12, "height": 9, "rows": ["############", "#..........#", "#..........#", "#..........#", "#..........#", "#..........#", "#####A######", "#..........B", "############"], "legend": {"#": "wall", ".": "floor", "A": "gate", "B": "gate"}, "heroStart": {"x": 5, "y": 4}, "gates": [{"id": "A", "x": 5, "y": 6}, {"id": "B", "x": 11, "y": 7}], "npcs": [{"id": "elder", "name": "Elder Mira", "x": 3, "y": 2, "questId": "V01"}, {"id": "smith", "name": "Smith Orin", "x": 8, "y": 2, "questId": "V02"}]}
Player_create:
  tag: players
  summary: Create a player
  description: Starts a new game at the hero start position with no experience. The returned player id is the only credential, there are no accounts, so the client must keep it and send it with every later call. The number of players is capped and creation is rate limited per address.
  responses:
    "201":
      description: The new player.
      example: {"playerId": "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10", "xp": 0, "level": 1, "levelFloorXp": 0, "nextLevelXp": 230, "completedQuestIds": [], "hero": {"x": 5, "y": 4}, "openGates": [], "worldEffects": []}
    "429":
      description: Too many players were created from this address in the last minute.
      example: {"error": {"code": "RATE_LIMITED", "message": "You are going a little fast. Wait a few seconds and try again."}}
    "503":
      description: The server already holds as many players as it allows.
      example: {"error": {"code": "SERVER_BUSY", "message": "The village is full right now. Try again later."}}
Player_get:
  tag: players
  summary: Get a player
  description: Returns the current state of one player, which is what a client needs to draw the screen again after a reload.
  parameters:
    playerId: {description: "The player id returned when the player was created.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
  responses:
    "200":
      description: The player.
      example: {"playerId": "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10", "xp": 100, "level": 1, "levelFloorXp": 0, "nextLevelXp": 230, "completedQuestIds": ["V01"], "hero": {"x": 5, "y": 4}, "openGates": ["A"], "worldEffects": [{"type": "OPEN_GATE", "target": "A", "message": "The north gate creaks open."}]}
    "400":
      description: The player id is not a valid id.
      example: {"error": {"code": "BAD_REQUEST", "message": "That player id is not valid."}}
    "404":
      description: No player has this id.
      example: {"error": {"code": "PLAYER_NOT_FOUND", "message": "We could not find that player. Start a new game."}}
World_move:
  tag: world
  summary: Walk the hero
  description: Moves the hero one step at a time through the given directions and stops at the first wall, closed gate or character. Between 1 and 32 steps are accepted per call. The server decides where the hero ends up; the client only draws it.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
  requestExample: {"directions": ["LEFT", "LEFT", "UP"]}
  responses:
    "200":
      description: The position after the walk.
      example: {"x": 3, "y": 3, "applied": 3, "blocked": false}
    "400":
      description: No directions, more than 32, or a direction other than UP, DOWN, LEFT and RIGHT.
      example: {"error": {"code": "BAD_REQUEST", "message": "Send between 1 and 32 directions: UP, DOWN, LEFT or RIGHT."}}
    "404":
      description: No player has this id.
      example: {"error": {"code": "PLAYER_NOT_FOUND", "message": "We could not find that player. Start a new game."}}
    "415":
      description: The request was not sent as JSON.
      example: {"error": {"code": "BAD_REQUEST", "message": "Send your request as JSON."}}
World_interact:
  tag: world
  summary: Talk to the character next to the hero
  description: Talks to the character standing next to the hero. The reply has the character's lines and the state of the quest they give, which tells the client whether to open the quest panel.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
  responses:
    "200":
      description: What the character says.
      example: {"npcId": "elder", "npcName": "Elder Mira", "questId": "V01", "questStatus": "AVAILABLE", "lines": ["Traveller! The north gate is sealed by an old spell.", "Only a hero who can write their name in Java may pass."]}
    "404":
      description: No player has this id.
      example: {"error": {"code": "PLAYER_NOT_FOUND", "message": "We could not find that player. Start a new game."}}
    "409":
      description: No character is next to the hero.
      example: {"error": {"code": "NO_NPC_ADJACENT", "message": "There is nobody to talk to here."}}
Quest_list:
  tag: quests
  summary: List the quests
  description: Returns every quest in teaching order with its state for this player. A quest is LOCKED until the one before it is completed, AVAILABLE when it can be played and COMPLETED once it has been solved.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
  responses:
    "200":
      description: The quests.
      example: {"quests": [{"id": "V01", "region": "V", "regionName": "The Village of First Steps", "title": "The Adventurer's Name", "concept": "Variables and String", "status": "AVAILABLE", "xp": 100}, {"id": "V02", "region": "V", "regionName": "The Village of First Steps", "title": "The Four Elements", "concept": "Primitive types", "status": "LOCKED", "xp": 100}]}
    "404":
      description: No player has this id.
      example: {"error": {"code": "PLAYER_NOT_FOUND", "message": "We could not find that player. Start a new game."}}
Quest_detail:
  tag: quests
  summary: Open a quest
  description: Returns the story, goal, starter code, visible tests and unlocked hints of one quest. Hidden tests are never listed. The explanation, the reference solution and the world effect are empty until the player has completed the quest, after which they are filled in. Opening a locked quest is refused.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
    questId: {description: "The quest id, a region letter and a two-digit number.", example: "V01"}
  responses:
    "200":
      description: The quest.
      example: {"id": "V01", "title": "The Adventurer's Name", "concept": "Variables and String", "story": "Elder Mira squints at you. A hero with no name cannot cross the gate. Write it down in Java, and say it aloud.", "goal": "Create a String variable called name holding Adventurer, then print Hello, Adventurer! using System.out.println and your variable.", "kind": "STDOUT", "profile": "BASIC", "status": "AVAILABLE", "xp": 100, "starterCode": "public class Main {\n    public static void main(String[] args) {\n    }\n}", "lastSource": null, "visibleTests": [{"name": "prints the greeting", "call": null, "expected": "Hello, Adventurer!"}, {"name": "declares a String variable called name", "call": null, "expected": null}], "hintsTotal": 3, "hintsUnlocked": 0, "hints": [], "failedAttempts": 0, "explanation": null, "referenceSolution": null, "worldEffect": null}
    "400":
      description: The player id or the quest id is not a valid id.
      example: {"error": {"code": "BAD_REQUEST", "message": "That quest id is not valid."}}
    "403":
      description: The quest before this one has not been completed yet.
      example: {"error": {"code": "QUEST_LOCKED", "message": "Finish \"The Adventurer's Name\" first."}}
    "404":
      description: No player or no quest has this id.
      example: {"error": {"code": "QUEST_NOT_FOUND", "message": "There is no quest with that id."}}
Quest_run:
  tag: quests
  summary: Try code without submitting
  description: Compiles and runs the code in the isolated sandbox and evaluates the visible tests only. Nothing is saved as progress and no hidden data is returned, so a player can try as often as they like within the rate limit. Compiler and runtime messages are returned as they are, with friendly advice beside them. One run or submit per player at a time.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
    questId: {description: "The quest id.", example: "V01"}
  requestExample: {"source": "public class Main {\n    public static void main(String[] args) {\n        String name = \"Adventurer\";\n        System.out.println(\"Hello, \" + name + \"!\");\n    }\n}"}
  responses:
    "200":
      description: The result of the run, whether or not the code is correct.
      example: {"questId": "V01", "scope": "VISIBLE", "passed": true, "status": "OK", "compilerOutput": "", "stdout": "Hello, Adventurer!\n", "stderr": "", "summary": "All visible tests pass. Press Submit to finish the challenge.", "friendlyHints": [], "tests": [{"name": "prints the greeting", "hidden": false, "passed": true, "expected": "Hello, Adventurer!", "actual": "Hello, Adventurer!", "message": "Passed."}, {"name": "declares a String variable called name", "hidden": false, "passed": true, "expected": null, "actual": null, "message": "Passed."}], "durationMillis": 1215}
    "400":
      description: The body is not valid JSON, or an id is not valid.
      example: {"error": {"code": "BAD_REQUEST", "message": "Something in your request was not understood. Check the values and try again."}}
    "403":
      description: The quest is locked.
      example: {"error": {"code": "QUEST_LOCKED", "message": "Finish \"The Adventurer's Name\" first."}}
    "404":
      description: No player or no quest has this id.
      example: {"error": {"code": "QUEST_NOT_FOUND", "message": "There is no quest with that id."}}
    "413":
      description: The code is longer than 20000 characters, or the request is larger than 64 KiB.
      example: {"error": {"code": "SOURCE_TOO_LARGE", "message": "That code is too long. Keep it under 20000 characters."}}
    "415":
      description: The request was not sent as JSON.
      example: {"error": {"code": "BAD_REQUEST", "message": "Send your request as JSON."}}
    "422":
      description: The quest needs a sandbox profile this server does not offer yet.
      example: {"error": {"code": "QUEST_PROFILE_UNSUPPORTED", "message": "This kind of challenge is not available yet."}}
    "429":
      description: A run of this player is still in progress, or the per-minute limit was reached.
      example: {"error": {"code": "RUN_IN_PROGRESS", "message": "One of your runs is still going. Wait for it to finish."}}
    "503":
      description: The server is running as many sandboxes as it allows.
      example: {"error": {"code": "SERVER_BUSY", "message": "The code runner is busy right now. Try again in a moment."}}
Quest_submit:
  tag: quests
  summary: Submit code for grading
  description: Runs the code like a trial run but evaluates all tests, hidden ones included. A pass completes the quest and, the first time, awards experience points and applies the world effect. A failure returns which tests failed without revealing hidden expectations, and unlocks the next hint. Hidden test results only say whether they passed.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
    questId: {description: "The quest id.", example: "V01"}
  requestExample: {"source": "public class Main {\n    public static void main(String[] args) {\n        String name = \"Adventurer\";\n        System.out.println(\"Hello, \" + name + \"!\");\n    }\n}"}
  responses:
    "200":
      description: The graded result. completion is filled only when the submit passed.
      example: {"questId": "V01", "scope": "ALL", "passed": true, "status": "OK", "compilerOutput": "", "stdout": "Hello, Adventurer!\n", "stderr": "", "summary": "Challenge complete!", "friendlyHints": [], "tests": [{"name": "prints the greeting", "hidden": false, "passed": true, "expected": "Hello, Adventurer!", "actual": "Hello, Adventurer!", "message": "Passed."}, {"name": "Hidden test 1", "hidden": true, "passed": true, "expected": null, "actual": null, "message": "Passed."}], "durationMillis": 817, "completion": {"firstCompletion": true, "xpAwarded": 100, "totalXp": 100, "level": 1, "levelUp": false, "worldEffect": {"type": "OPEN_GATE", "target": "A", "message": "The north gate creaks open."}, "explanation": "String name = \"Adventurer\"; creates a variable: a named place in memory that holds text.", "unlockedQuestId": "V02"}}
    "400":
      description: The body is not valid JSON, or an id is not valid.
      example: {"error": {"code": "BAD_REQUEST", "message": "Something in your request was not understood. Check the values and try again."}}
    "403":
      description: The quest is locked.
      example: {"error": {"code": "QUEST_LOCKED", "message": "Finish \"The Adventurer's Name\" first."}}
    "404":
      description: No player or no quest has this id.
      example: {"error": {"code": "QUEST_NOT_FOUND", "message": "There is no quest with that id."}}
    "413":
      description: The code is longer than 20000 characters, or the request is larger than 64 KiB.
      example: {"error": {"code": "SOURCE_TOO_LARGE", "message": "That code is too long. Keep it under 20000 characters."}}
    "415":
      description: The request was not sent as JSON.
      example: {"error": {"code": "BAD_REQUEST", "message": "Send your request as JSON."}}
    "422":
      description: The quest needs a sandbox profile this server does not offer yet.
      example: {"error": {"code": "QUEST_PROFILE_UNSUPPORTED", "message": "This kind of challenge is not available yet."}}
    "429":
      description: A run of this player is still in progress, or the per-minute limit was reached.
      example: {"error": {"code": "RUN_IN_PROGRESS", "message": "One of your runs is still going. Wait for it to finish."}}
    "503":
      description: The server is running as many sandboxes as it allows.
      example: {"error": {"code": "SERVER_BUSY", "message": "The code runner is busy right now. Try again in a moment."}}
Quest_hint:
  tag: quests
  summary: Unlock the next hint
  description: Unlocks and returns the next hint of a quest. Hints become available after the first failed submit and go from a gentle nudge to nearly the answer. Unlocking is saved, so the hint also appears in the quest view afterwards.
  parameters:
    playerId: {description: "The player id.", example: "3f2b8c1e-5a47-4d0e-9c1a-7b6d2e8f4a10"}
    questId: {description: "The quest id.", example: "V01"}
  responses:
    "200":
      description: The hint that was just unlocked.
      example: {"hintNumber": 1, "hint": "A variable is a labelled box. The type String is the box for text.", "hintsUnlocked": 1, "hintsTotal": 3}
    "400":
      description: An id is not valid.
      example: {"error": {"code": "BAD_REQUEST", "message": "That quest id is not valid."}}
    "404":
      description: No player or no quest has this id.
      example: {"error": {"code": "QUEST_NOT_FOUND", "message": "There is no quest with that id."}}
    "409":
      description: No hint can be unlocked yet because there was no failed submit, or all hints are already unlocked.
      example: {"error": {"code": "HINT_NOT_AVAILABLE", "message": "Give the challenge a try first, then ask for a hint."}}
