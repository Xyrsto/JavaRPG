infinite-loop.guard=ALLOW
infinite-loop.container=TIMEOUT
fork-bomb.guard=REJECT
# TIMEOUT: the pids limit makes thread creation fail and main dies, but the already started
# non-daemon spinner threads keep the JVM alive until the in-container timeout kills it.
fork-bomb.container=RUNTIME_ERROR,OK,TIMEOUT
memory-bomb.guard=ALLOW
memory-bomb.container=MEMORY_LIMIT,RUNTIME_ERROR
giant-stdout.guard=ALLOW
giant-stdout.container=OUTPUT_LIMIT,TIMEOUT
system-exit.guard=REJECT
system-exit.container=RUNTIME_ERROR,OK
stdin-read.guard=REJECT
stdin-read.container=OK,RUNTIME_ERROR
file-write.guard=REJECT
file-write.container=RUNTIME_ERROR,OK
file-read.guard=REJECT
file-read.container=OK,RUNTIME_ERROR
network-call.guard=REJECT
network-call.container=RUNTIME_ERROR,OK
reflection.guard=REJECT
reflection.container=RUNTIME_ERROR,OK
runtime-exec.guard=REJECT
runtime-exec.container=RUNTIME_ERROR,OK
class-loading.guard=REJECT
class-loading.container=RUNTIME_ERROR,OK
stack-overflow.guard=ALLOW
stack-overflow.container=RUNTIME_ERROR
static-init-abuse.guard=ALLOW
static-init-abuse.container=TIMEOUT
static-import-exit.guard=REJECT
static-import-exit.container=OK,RUNTIME_ERROR
reflection-getmethods.guard=REJECT
reflection-getmethods.container=OK,RUNTIME_ERROR
network-reflection.guard=REJECT
